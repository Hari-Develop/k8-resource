apiVersion: v1
kind: Pod
metadata:
  name: pod-lables
  labels: 
    app: web
    tier: frontend
    env: dev
spec:
  containers:
  - name: nginx-container
    image: nginx:latest
    ports:
    - containerPort: 80
  - name: busybox-container
    image: alma-linux:latest
    command: ["sleep", "infinity"]